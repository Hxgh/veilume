name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SHADE_BROWSER: chromium
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veilume-verification
          path: |
            test-results/results.json
            test-results/*.png
            test-results/traces/
            releases/*.zip
            releases/SHA256SUMS.txt
          retention-days: 14
